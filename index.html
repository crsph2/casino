            color: #2c3e50;
            margin-bottom: 30px;
        }
        .controls {
            text-align: center;
            margin-bottom: 40px;
        }
        select {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            border-top: 5px solid #3498db;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            margin-top: 0;
            color: #2980b9;
            font-size: 1.25em;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            color: #34495e;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        ul {
            margin: 0;
            padding-left: 20px;
            font-size: 0.95em;
            color: #555;
        }
        li {

        .no-data {

            color: #7f8c8d;

        function updateMenu() {
            const selectedDay = document.getElementById('day-select').value;
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            const dayData = menuData[selectedDay];
            
            for (const casino in dayData) {
                const data = dayData[casino];
                
                let cardHtml = `<div class="card">
                    <h2>${casino}</h2>`;
                    
                if (data.fondos.length > 0) {
                    cardHtml += `<div class="section-title">Platos de Fondo</div><ul>`;
                    data.fondos.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.acompanamientos.length > 0) {
                    cardHtml += `<div class="section-title">Acompañamientos</div><ul>`;
                    data.acompanamientos.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.sopas.length > 0) {
                    cardHtml += `<div class="section-title">Sopa</div><ul>`;
                    data.sopas.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.ensaladas.length > 0) {
                    cardHtml += `<div class="section-title">Ensaladas</div><ul>`;
                    data.ensaladas.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.postres.length > 0) {
                    cardHtml += `<div class="section-title">Postres</div><ul>`;
                    data.postres.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.fondos.length === 0 && data.acompanamientos.length === 0) {
                    cardHtml += `<p class="no-data">No hay menú registrado para este día.</p>`;
                }
                
                cardHtml += `</div>`;
                container.innerHTML += cardHtml;
            }
        }
        
        // Cargar menú del primer día por defecto
        window.onload = updateMenu;
