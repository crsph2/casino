<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Semanal por Casino</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .controls {
            text-align: center;
            margin-bottom: 40px;
        }
        select {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            border-top: 5px solid #3498db;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            margin-top: 0;
            color: #2980b9;
            font-size: 1.25em;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            color: #34495e;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        ul {
            margin: 0;
            padding-left: 20px;
            font-size: 0.95em;
            color: #555;
        }
        li {
            margin-bottom: 4px;
        }
        .no-data {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Menú Semanal de Casinos UDP</h1>
    
    <div class="controls">

            <option value="2026-10-12">Lunes 12 de Octubre (Feriado)</option>
            <option value="2026-10-13">Martes 13 de Octubre</option>
            <option value="2026-10-14">Miércoles 14 de Octubre</option>
            <option value="2026-10-15">Jueves 15 de Octubre</option>
            <option value="2026-10-16">Viernes 16 de Octubre</option>
        </select>
    </div>

        <!-- Tarjetas generadas dinámicamente -->
    </div>

DÍA"], "ensaladas": ["ENSALADAS DEL DÍA"], "sopas": ["SOPA DEL DÍA"]}}};
        
        function updateMenu() {
            const selectedDay = document.getElementById('day-select').value;
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            const dayData = menuData[selectedDay];
            
            for (const casino in dayData) {
                const data = dayData[casino];
                
                let cardHtml = `<div class="card">
                    <h2>${casino}</h2>`;
                    
                if (data.fondos.length > 0) {
                    cardHtml += `<div class="section-title">Platos de Fondo</div><ul>`;
                    data.fondos.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.acompanamientos.length > 0) {
                    cardHtml += `<div class="section-title">Acompañamientos</div><ul>`;
                    data.acompanamientos.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.sopas.length > 0) {
                    cardHtml += `<div class="section-title">Sopa</div><ul>`;
                    data.sopas.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.ensaladas.length > 0) {
                    cardHtml += `<div class="section-title">Ensaladas</div><ul>`;
                    data.ensaladas.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.postres.length > 0) {
                    cardHtml += `<div class="section-title">Postres</div><ul>`;
                    data.postres.forEach(item => cardHtml += `<li>${item}</li>`);
                    cardHtml += `</ul>`;
                }
                
                if (data.fondos.length === 0 && data.acompanamientos.length === 0) {
                    cardHtml += `<p class="no-data">${data.nota ? data.nota : 'No hay menú registrado para este día.'}</p>`;
                }
                
                cardHtml += `</div>`;
                container.innerHTML += cardHtml;
            }
        }
        
        // Cargar menú del primer día por defecto
        window.onload = updateMenu;
    </script>
</body>
</html>
